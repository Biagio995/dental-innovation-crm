openapi: 3.1.0
info:
  title: Dental Innovation CRM - Recalls & Communications API
  version: 1.0.0
  description: |
    Recalls queue, message templates, and communications management for the Dental Innovation CRM.
    
    ## Authentication
    All endpoints require session-based authentication with HTTP-only cookies (Laravel Sanctum SPA mode).
    See `openapi-auth.yaml` for authentication flow.
    
    ## Role-Based Access
    - **owner/admin**: Full CRUD including delete, can manage templates
    - **operator**: Can view all, create recalls/communications, record contact outcomes (no delete, no template management)

servers:
  - url: http://localhost:8080
    description: Local development
  - url: http://localhost:5173
    description: Vite dev server (SPA)

paths:
  /api/message-templates:
    get:
      summary: List message templates
      description: Returns a paginated list of message templates for SMS and email.
      operationId: listMessageTemplates
      tags:
        - Message Templates
      security:
        - cookieAuth: []
      parameters:
        - name: channel
          in: query
          description: Filter by channel (sms or email)
          schema:
            type: string
            enum: [sms, email]
        - name: active_only
          in: query
          description: Only return active templates
          schema:
            type: boolean
            default: false
        - name: search
          in: query
          description: Search in name and body
          schema:
            type: string
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Paginated list of templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MessageTemplate'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'

    post:
      summary: Create message template
      description: |
        Creates a new message template. 
        **Requires owner or admin role.** Operators receive 403 Forbidden.
      operationId: createMessageTemplate
      tags:
        - Message Templates
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageTemplateCreate'
      responses:
        '201':
          description: Template created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MessageTemplate'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/message-templates/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get message template
      description: Returns a single message template by ID.
      operationId: getMessageTemplate
      tags:
        - Message Templates
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Template details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MessageTemplate'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: Update message template
      description: |
        Updates an existing message template.
        **Requires owner or admin role.** Operators receive 403 Forbidden.
      operationId: updateMessageTemplate
      tags:
        - Message Templates
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageTemplateUpdate'
      responses:
        '200':
          description: Template updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MessageTemplate'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      summary: Delete message template
      description: |
        Soft-deletes a message template.
        **Requires owner or admin role.** Operators receive 403 Forbidden.
      operationId: deleteMessageTemplate
      tags:
        - Message Templates
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Template deleted
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/message-templates/{id}/preview:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      summary: Preview rendered template
      description: |
        Renders the template with sample or provided data for preview.
        Returns the rendered subject and body with variables replaced.
      operationId: previewMessageTemplate
      tags:
        - Message Templates
      security:
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  description: Custom variable values to use for preview
                  example:
                    nome: Mario Rossi
                    data: 01/12/2024
                    ora: "10:30"
      responses:
        '200':
          description: Rendered preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      subject:
                        type: string
                        nullable: true
                      body:
                        type: string
                      variables_used:
                        type: array
                        items:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/recalls:
    get:
      summary: List recall tasks
      description: Returns a paginated list of recall tasks with filtering options.
      operationId: listRecalls
      tags:
        - Recalls
      security:
        - cookieAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by recall status
          schema:
            type: string
            enum: [pending, contacted, scheduled, no_answer, declined, expired]
        - name: patient_id
          in: query
          description: Filter by patient ID
          schema:
            type: integer
        - name: assigned_to
          in: query
          description: Filter by assigned user ID
          schema:
            type: integer
        - name: overdue_only
          in: query
          description: Only show overdue recalls
          schema:
            type: boolean
            default: false
        - name: due_from
          in: query
          description: Filter recalls due from this date (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: due_to
          in: query
          description: Filter recalls due until this date (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Paginated list of recalls
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RecallTask'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'

    post:
      summary: Create recall task
      description: Creates a new recall task for a patient.
      operationId: createRecall
      tags:
        - Recalls
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecallTaskCreate'
      responses:
        '201':
          description: Recall task created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RecallTask'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/recalls/queue:
    get:
      summary: Get recalls queue
      description: |
        Returns recall tasks that are actionable (pending, contacted, or no_answer)
        and due within the specified days. Sorted by due date and contact attempts.
      operationId: getRecallsQueue
      tags:
        - Recalls
      security:
        - cookieAuth: []
      parameters:
        - name: days_ahead
          in: query
          description: Include recalls due within this many days (default 7)
          schema:
            type: integer
            default: 7
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Paginated queue of actionable recalls
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RecallTask'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/recalls/generate-from-visits:
    post:
      summary: Generate recall tasks from visits
      description: |
        Creates recall tasks from visits that have recommended_recall_date set
        and don't already have an active recall task.
      operationId: generateRecallsFromVisits
      tags:
        - Recalls
      security:
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                days_ahead:
                  type: integer
                  default: 30
                  description: Generate for recalls due within this many days
      responses:
        '200':
          description: Generation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Created 5 recall tasks from visits.
                  count:
                    type: integer
                    example: 5
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/recalls/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get recall task
      description: Returns a single recall task by ID.
      operationId: getRecall
      tags:
        - Recalls
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Recall task details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RecallTask'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: Update recall task
      description: Updates an existing recall task.
      operationId: updateRecall
      tags:
        - Recalls
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecallTaskUpdate'
      responses:
        '200':
          description: Recall task updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RecallTask'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      summary: Delete recall task
      description: |
        Deletes a recall task.
        **Requires owner or admin role.** Operators receive 403 Forbidden.
      operationId: deleteRecall
      tags:
        - Recalls
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Recall task deleted
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/recalls/{id}/contact-outcome:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      summary: Record contact outcome
      description: |
        Records the outcome of a contact attempt for a recall task.
        Increments contact_attempts and updates status accordingly.
        When outcome is 'scheduled', a resulting_appointment_id must be provided.
      operationId: recordContactOutcome
      tags:
        - Recalls
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactOutcome'
      responses:
        '200':
          description: Outcome recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RecallTask'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/communication-logs:
    get:
      summary: List communication logs
      description: Returns a paginated list of communication logs with filtering options.
      operationId: listCommunicationLogs
      tags:
        - Communication Logs
      security:
        - cookieAuth: []
      parameters:
        - name: patient_id
          in: query
          description: Filter by patient ID
          schema:
            type: integer
        - name: appointment_id
          in: query
          description: Filter by appointment ID
          schema:
            type: integer
        - name: recall_task_id
          in: query
          description: Filter by recall task ID
          schema:
            type: integer
        - name: channel
          in: query
          description: Filter by channel
          schema:
            type: string
            enum: [sms, email]
        - name: status
          in: query
          description: Filter by status
          schema:
            type: string
            enum: [queued, sent, delivered, failed, bounced]
        - name: reminder_type
          in: query
          description: Filter by reminder type
          schema:
            type: string
            enum: [appointment_48h, appointment_24h, post_visit, recall]
        - name: from
          in: query
          description: Filter logs created from this datetime
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Filter logs created until this datetime
          schema:
            type: string
            format: date-time
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Paginated list of communication logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CommunicationLog'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'

    post:
      summary: Create communication log
      description: |
        Registers an outbound message in the communication log.
        This can be used to log manual communications or integrate with external systems.
      operationId: createCommunicationLog
      tags:
        - Communication Logs
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunicationLogCreate'
      responses:
        '201':
          description: Communication log created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CommunicationLog'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/communication-logs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get communication log
      description: Returns a single communication log by ID.
      operationId: getCommunicationLog
      tags:
        - Communication Logs
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Communication log details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CommunicationLog'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Delete communication log
      description: |
        Deletes a communication log.
        **Requires owner or admin role.** Operators receive 403 Forbidden.
      operationId: deleteCommunicationLog
      tags:
        - Communication Logs
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Communication log deleted
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/communication-logs/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    patch:
      summary: Update communication status
      description: |
        Updates the delivery status of a communication log.
        Used to track message delivery outcomes (sent, delivered, failed, bounced).
      operationId: updateCommunicationStatus
      tags:
        - Communication Logs
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [queued, sent, delivered, failed, bounced]
                external_id:
                  type: string
                  maxLength: 255
                  description: External system message ID
                error_message:
                  type: string
                  maxLength: 10000
                  description: Error message if status is failed/bounced
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CommunicationLog'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: dental_innovation_crm_session
      description: Session cookie set by the login endpoint

  schemas:
    MessageTemplate:
      type: object
      required:
        - id
        - name
        - channel
        - body
        - is_active
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 100
        channel:
          type: string
          enum: [sms, email]
        subject:
          type: string
          maxLength: 255
          nullable: true
          description: Email subject (null for SMS)
        body:
          type: string
          description: Template body with {variable} placeholders
        variables:
          type: array
          items:
            type: string
          description: List of variable names used in the template
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MessageTemplateCreate:
      type: object
      required:
        - name
        - channel
        - body
      properties:
        name:
          type: string
          maxLength: 100
        channel:
          type: string
          enum: [sms, email]
        subject:
          type: string
          maxLength: 255
          nullable: true
        body:
          type: string
          maxLength: 10000
        variables:
          type: array
          items:
            type: string
            maxLength: 50
        is_active:
          type: boolean
          default: true

    MessageTemplateUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        channel:
          type: string
          enum: [sms, email]
        subject:
          type: string
          maxLength: 255
          nullable: true
        body:
          type: string
          maxLength: 10000
        variables:
          type: array
          items:
            type: string
            maxLength: 50
        is_active:
          type: boolean

    RecallTask:
      type: object
      required:
        - id
        - patient_id
        - due_date
        - status
      properties:
        id:
          type: integer
          format: int64
        patient_id:
          type: integer
          format: int64
        patient:
          $ref: '#/components/schemas/PatientSummary'
        visit_id:
          type: integer
          format: int64
          nullable: true
        due_date:
          type: string
          format: date
        status:
          type: string
          enum: [pending, contacted, scheduled, no_answer, declined, expired]
        status_label:
          type: string
        notes:
          type: string
          nullable: true
        contact_attempts:
          type: integer
          default: 0
        last_contact_at:
          type: string
          format: date-time
          nullable: true
        is_overdue:
          type: boolean
        created_by:
          type: integer
          format: int64
          nullable: true
        creator:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            name:
              type: string
        assigned_to:
          type: integer
          format: int64
          nullable: true
        assignee:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            name:
              type: string
        resulting_appointment_id:
          type: integer
          format: int64
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RecallTaskCreate:
      type: object
      required:
        - patient_id
        - due_date
      properties:
        patient_id:
          type: integer
          format: int64
        visit_id:
          type: integer
          format: int64
          nullable: true
        due_date:
          type: string
          format: date
          description: Must be today or in the future
        notes:
          type: string
          maxLength: 10000
        assigned_to:
          type: integer
          format: int64
          nullable: true

    RecallTaskUpdate:
      type: object
      properties:
        due_date:
          type: string
          format: date
        status:
          type: string
          enum: [pending, contacted, scheduled, no_answer, declined, expired]
        notes:
          type: string
          maxLength: 10000
          nullable: true
        assigned_to:
          type: integer
          format: int64
          nullable: true
        resulting_appointment_id:
          type: integer
          format: int64
          nullable: true

    ContactOutcome:
      type: object
      required:
        - outcome
      properties:
        outcome:
          type: string
          enum: [contacted, scheduled, no_answer, declined]
          description: |
            - contacted: Patient reached but no appointment scheduled yet
            - scheduled: Appointment successfully scheduled (requires resulting_appointment_id)
            - no_answer: Could not reach patient
            - declined: Patient declined to schedule
        notes:
          type: string
          maxLength: 10000
        resulting_appointment_id:
          type: integer
          format: int64
          nullable: true
          description: Required when outcome is 'scheduled'

    CommunicationLog:
      type: object
      required:
        - id
        - patient_id
        - channel
        - status
        - recipient
        - body
      properties:
        id:
          type: integer
          format: int64
        patient_id:
          type: integer
          format: int64
        patient:
          $ref: '#/components/schemas/PatientSummary'
        appointment_id:
          type: integer
          format: int64
          nullable: true
        recall_task_id:
          type: integer
          format: int64
          nullable: true
        message_template_id:
          type: integer
          format: int64
          nullable: true
        channel:
          type: string
          enum: [sms, email]
        channel_label:
          type: string
        status:
          type: string
          enum: [queued, sent, delivered, failed, bounced]
        status_label:
          type: string
        recipient:
          type: string
          description: Email address or phone number
        subject:
          type: string
          nullable: true
        body:
          type: string
        reminder_type:
          type: string
          enum: [appointment_48h, appointment_24h, post_visit, recall]
          nullable: true
        reminder_type_label:
          type: string
          nullable: true
        external_id:
          type: string
          nullable: true
          description: External system message ID
        error_message:
          type: string
          nullable: true
        metadata:
          type: object
          nullable: true
        sent_at:
          type: string
          format: date-time
          nullable: true
        sent_by:
          type: integer
          format: int64
          nullable: true
        sender:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            name:
              type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CommunicationLogCreate:
      type: object
      required:
        - patient_id
        - channel
        - recipient
        - body
      properties:
        patient_id:
          type: integer
          format: int64
        appointment_id:
          type: integer
          format: int64
          nullable: true
        recall_task_id:
          type: integer
          format: int64
          nullable: true
        message_template_id:
          type: integer
          format: int64
          nullable: true
        channel:
          type: string
          enum: [sms, email]
        status:
          type: string
          enum: [queued, sent, delivered, failed, bounced]
          default: queued
        recipient:
          type: string
          maxLength: 255
        subject:
          type: string
          maxLength: 255
          nullable: true
        body:
          type: string
          maxLength: 10000
        reminder_type:
          type: string
          enum: [appointment_48h, appointment_24h, post_visit, recall]
          nullable: true
        external_id:
          type: string
          maxLength: 255
          nullable: true
        metadata:
          type: object
          nullable: true

    PatientSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        first_name:
          type: string
        last_name:
          type: string
        full_name:
          type: string
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true

    PaginationLinks:
      type: object
      properties:
        first:
          type: string
          format: uri
        last:
          type: string
          format: uri
        prev:
          type: string
          format: uri
          nullable: true
        next:
          type: string
          format: uri
          nullable: true

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        from:
          type: integer
          nullable: true
        last_page:
          type: integer
        path:
          type: string
          format: uri
        per_page:
          type: integer
        to:
          type: integer
          nullable: true
        total:
          type: integer

    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    UnauthenticatedError:
      type: object
      properties:
        message:
          type: string
          example: Unauthenticated.

    ForbiddenError:
      type: object
      properties:
        message:
          type: string
          example: This action is unauthorized.

    NotFoundError:
      type: object
      properties:
        message:
          type: string

  responses:
    Unauthenticated:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthenticatedError'
    Forbidden:
      description: Not authorized (insufficient permissions)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForbiddenError'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFoundError'
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'

tags:
  - name: Message Templates
    description: SMS and email template management
  - name: Recalls
    description: Patient recall queue and task management
  - name: Communication Logs
    description: Outbound communication logging and tracking
